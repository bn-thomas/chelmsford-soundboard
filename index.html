<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Draft Soundboard</title>
    <style>
      /* One page serves two homes: a narrow Apps Script sidebar and a browser
         tab of its own. auto-fit lets the same grid be 2 columns or 6. */
      body { font-family: Roboto, Arial, sans-serif; margin: 0 auto; padding: 10px;
             background: #f8f9fa; max-width: 900px; }
      h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #5f6368; margin: 0 0 10px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
      button {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
        min-height: 76px;
        padding: 12px 4px; border: 1px solid #dadce0; border-radius: 8px; background: #fff;
        cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; color: #202124;
        transition: transform .05s, box-shadow .1s;
      }
      button:hover { box-shadow: 0 1px 4px rgba(0,0,0,.2); }
      button:active { transform: scale(.96); background: #e8f0fe; }
      /* Phones are the main way the league will use this: no zoom on tap, no
         text selection when jabbing a button repeatedly. */
      button { touch-action: manipulation; -webkit-user-select: none; user-select: none;
               -webkit-tap-highlight-color: transparent; }
      @media (pointer: coarse) { button { min-height: 92px; font-size: 13px; } .emoji { font-size: 26px; } }
      .emoji { font-size: 22px; line-height: 1; }
      .key { font-size: 10px; color: #80868b; font-weight: 400; }
      .hint { margin-top: 12px; font-size: 11px; color: #80868b; line-height: 1.45; }
      .empty { padding: 24px 12px; text-align: center; color: #80868b; font-size: 13px;
               border: 1px dashed #dadce0; border-radius: 8px; background: #fff; }
      #stop { grid-column: 1 / -1; background: #fce8e6; border-color: #f5c6c2; color: #c5221f;
              padding: 8px; min-height: 0; }
    </style>
  </head>
  <body>
    <h1>Draft Soundboard</h1>
    <div class="grid" id="grid"></div>
    <p class="hint">Press a sound's key to fire it.<br />
    <strong>On iPhone:</strong> turn the ringer switch on, or the phone silences this page.</p>

    <script>
      var CLIPS = [{"key": "clip_bruh", "label": "Bruh", "emoji": "🔊", "hotkey": "1", "use": "", "src": "42e8174310c7951e/bcebfbd1d700b0d7.mp3"}, {"key": "clip_whopper", "label": "Whopper", "emoji": "🔊", "hotkey": "2", "use": "", "src": "42e8174310c7951e/f0261957a9567861.mp3"}, {"key": "clip_espn", "label": "ESPN", "emoji": "🔊", "hotkey": "3", "use": "", "src": "42e8174310c7951e/b0247a43478784cd.mp3"}, {"key": "clip_nicey", "label": "Nicey", "emoji": "🔊", "hotkey": "4", "use": "", "src": "42e8174310c7951e/a4714938da8ab175.mp3"}, {"key": "clip_snf", "label": "SNF", "emoji": "🔊", "hotkey": "5", "use": "", "src": "42e8174310c7951e/9f680ab423e4b662.mp3"}, {"key": "clip_nfl-draft", "label": "NFL Draft", "emoji": "🔊", "hotkey": "6", "use": "", "src": "42e8174310c7951e/53c4ab711a9f02bd.mp3"}, {"key": "clip_08-mia", "label": "08 Mia", "emoji": "🔊", "hotkey": "7", "use": "", "src": "42e8174310c7951e/13510f890b88f8ee.mp3"}, {"key": "clip_lost-the-round", "label": "Lost The Round", "emoji": "🔊", "hotkey": "8", "use": "", "src": "42e8174310c7951e/f2d23956f85eecc6.mp3"}, {"key": "clip_mission-failed-well-get-em-next-time", "label": "Mission Failed Well Get Em Next Time", "emoji": "🔊", "hotkey": "9", "use": "", "src": "42e8174310c7951e/f689490aa4dd4c23.mp3"}, {"key": "clip_nflear", "label": "NFL Ear", "emoji": "🔊", "hotkey": "0", "use": "", "src": "42e8174310c7951e/33095887a2595909.mp3"}, {"key": "clip_wet-fart", "label": "Wet Fart", "emoji": "🔊", "hotkey": "q", "use": "", "src": "42e8174310c7951e/1d5e5c5e20dbe67e.mp3"}];

      // One preloaded element per clip; playing a clone lets the same sound
      // overlap itself instead of restarting mid-hit.
      var AUDIO = {};
      CLIPS.forEach(function (c) {
        var el = new Audio(c.src);
        el.preload = 'auto';
        AUDIO[c.key] = el;
      });

      // Everything currently sounding, so "Stop everything" can reach clones
      // that nothing else holds a reference to.
      var playing = [];

      function play(key) {
        var base = AUDIO[key];
        if (!base) return;
        var one = base.cloneNode();
        one.volume = 1;
        playing.push(one);
        one.addEventListener('ended', function () {
          var i = playing.indexOf(one);
          if (i >= 0) playing.splice(i, 1);
        });
        var p = one.play();
        if (p && p.catch) p.catch(function () {});
      }

      function stopAll() {
        playing.forEach(function (a) {
          try { a.pause(); a.currentTime = 0; } catch (e) {}
        });
        playing = [];
      }

      // --- wiring --------------------------------------------------------
      var grid = document.getElementById('grid');

      if (!CLIPS.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No sounds yet. Import some in the app, then publish.';
        grid.appendChild(empty);
      }

      CLIPS.forEach(function (s) {
        var b = document.createElement('button');
        b.innerHTML = '<span class="emoji">' + (s.emoji || '') + '</span>' + s.label +
                      '<span class="key">' + (s.hotkey || '') + '</span>';
        b.title = s.use || '';
        b.addEventListener('click', function () { play(s.key); });
        grid.appendChild(b);
      });

      if (CLIPS.length) {
        var stop = document.createElement('button');
        stop.id = 'stop';
        stop.textContent = 'Stop everything';
        stop.addEventListener('click', stopAll);
        grid.appendChild(stop);
      }

      document.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        var pressed = (e.key || '').toLowerCase();
        for (var i = 0; i < CLIPS.length; i++) {
          if (CLIPS[i].hotkey && CLIPS[i].hotkey.toLowerCase() === pressed) {
            play(CLIPS[i].key); e.preventDefault(); return;
          }
        }
      });
    </script>
  </body>
</html>
